<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>O Reino Perdido — Aventura 3D</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07120d;font-family:Arial,sans-serif;color:#fff}
  #game{width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  #title{position:absolute;top:12px;left:14px;font-weight:900;font-size:18px;text-shadow:0 2px 8px #000}
  #sub{font-size:11px;opacity:.8;font-weight:500}
  #stats{position:absolute;top:12px;right:14px;text-align:right;text-shadow:0 2px 8px #000;font-weight:800}
  #bar{width:150px;height:13px;border:2px solid #fff8;border-radius:10px;background:#281010;margin-top:5px;overflow:hidden}
  #hp{height:100%;width:100%;background:#ef3340;transition:.2s}
  #msg{position:absolute;left:50%;top:15%;transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:#06110dcc;border:1px solid #ffffff22;text-align:center;opacity:0;transition:.3s;font-weight:800}
  #hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:9px 13px;border-radius:12px;background:#06110dbb;border:1px solid #ffffff22;font-size:12px;text-align:center}
  #stick{position:absolute;left:22px;bottom:25px;width:118px;height:118px;border-radius:50%;background:#ffffff16;border:2px solid #ffffff30;pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:29px;top:29px;width:56px;height:56px;border-radius:50%;background:#ffffff55;border:2px solid #fff8}
  #attack{position:absolute;right:25px;bottom:30px;width:78px;height:78px;border-radius:50%;background:#2864e8aa;border:2px solid #fff8;color:#fff;font-size:26px;font-weight:900;pointer-events:auto;touch-action:none}
  #help{position:absolute;right:14px;bottom:118px;font-size:11px;opacity:.7;text-align:right}
  #win{display:none;position:absolute;inset:0;background:#04120de8;align-items:center;justify-content:center;text-align:center;pointer-events:auto}
  #win .box{padding:28px;border-radius:24px;background:#0b2419;border:1px solid #ffffff25;box-shadow:0 20px 80px #000}
  button{border:0;border-radius:14px;padding:12px 18px;background:#2f80ed;color:#fff;font-weight:900;font-size:15px}
  @media (min-width:800px){#stick,#attack,#jump{display:none}#hint{font-size:13px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="title">⚔️ O REINO PERDIDO<div id="sub">FASE 1 • FLORESTA SOMBRIA</div></div>
  <div id="stats">💎 <span id="crystals">0</span>/4 &nbsp; 🪙 <span id="coins">0</span><div id="bar"><div id="hp"></div></div></div>
  <div id="msg"></div>
  <div id="hint">WASD / setas para andar • Espaço para atacar • Encontre 4 cristais e entre no portal azul</div>
  <div id="stick"><div id="knob"></div></div>
  <button id="jump" style="right:118px;background:#27ae60aa">↟</button><button id="attack">⚔</button>
</div>
<div id="win"><div class="box">
  <div style="font-size:48px">🏆</div><h1>Fase concluída!</h1>
  <p>Você encontrou os 4 cristais da Floresta Sombria.</p>
  <button onclick="location.reload()">Jogar novamente</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x79b9d7);
scene.fog=new THREE.Fog(0x79b9d7,35,110);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);
camera.position.set(0,7,10);

scene.add(new THREE.HemisphereLight(0xbfe7ff,0x17341e,1.8));
const sun=new THREE.DirectionalLight(0xfff2cf,2.2); sun.position.set(-25,35,18); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-55; sun.shadow.camera.right=55; sun.shadow.camera.top=55; sun.shadow.camera.bottom=-55; scene.add(sun);

const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
const groundMat=mat(0x2d6a3b);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),groundMat); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

function box(x,y,z,sx,sy,sz,c){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(c)); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; scene.add(m); return m;
}
function tree(x,z,scale=1){
  const trunk= new THREE.Mesh(new THREE.CylinderGeometry(.35*scale,.5*scale,3*scale,8),mat(0x69452d));
  trunk.position.set(x,1.5*scale,z); trunk.castShadow=true; scene.add(trunk);
  const crown=new THREE.Mesh(new THREE.DodecahedronGeometry(2.2*scale,1),mat(0x164f2d));
  crown.position.set(x,4.0*scale,z); crown.castShadow=true; scene.add(crown);
  const crown2=new THREE.Mesh(new THREE.DodecahedronGeometry(1.5*scale,1),mat(0x23733b));
  crown2.position.set(x+.5*scale,5.0*scale,z+.2*scale); crown2.castShadow=true; scene.add(crown2);
}
for(let i=0;i<85;i++){
  let x=(Math.random()-.5)*150,z=(Math.random()-.5)*150;
  if(Math.hypot(x,z)<13) {i--;continue}
  tree(x,z,.7+Math.random()*1.2);
}
for(let i=0;i<45;i++){
  let x=(Math.random()-.5)*125,z=(Math.random()-.5)*125;
  if(Math.hypot(x,z)<10) continue;
  const r=.12+Math.random()*.28;
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(r,0),mat(0x68756b)); rock.position.set(x,r*.7,z); rock.castShadow=true; scene.add(rock);
}
// caminho
for(let i=0;i<35;i++) box(0,.015,(-42+i*2.2),5,.03,2.2,0x9a8059);

// personagem
const player=new THREE.Group(); scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,5,10),mat(0x171b20)); body.position.y=1.35; body.castShadow=true; player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.42,18,14),mat(0xb87450)); head.position.y=2.25; head.castShadow=true; player.add(head);
const hair=new THREE.Mesh(new THREE.DodecahedronGeometry(.45,1),mat(0x1b1513)); hair.position.set(0,2.55,-.02); hair.scale.set(1.05,.7,1.05); hair.castShadow=true; player.add(hair);
const cape=new THREE.Mesh(new THREE.BoxGeometry(1.0,.95,.12),mat(0x101923)); cape.position.set(0,1.5,.52); cape.castShadow=true; player.add(cape);
const sword=new THREE.Mesh(new THREE.BoxGeometry(.12,1.65,.08),mat(0xbfd6df)); sword.position.set(.62,1.45,.22); sword.rotation.z=-.25; sword.castShadow=true; player.add(sword);
const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.16),new THREE.MeshStandardMaterial({color:0x3b8cff,emissive:0x1555ff,emissiveIntensity:2}));
crystal.position.set(0,1.45,-.55); player.add(crystal);
player.position.set(0,0,8);

function makeCrystal(x,z){
  const g=new THREE.Group();
  const c=new THREE.Mesh(new THREE.OctahedronGeometry(.55),new THREE.MeshStandardMaterial({color:0x4ba3ff,emissive:0x1455ff,emissiveIntensity:2,roughness:.25,metalness:.15}));
  c.position.y=1; c.castShadow=true; g.add(c);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.8,.035,8,32),new THREE.MeshBasicMaterial({color:0x8ed5ff}));
  ring.rotation.x=Math.PI/2; ring.position.y=1; g.add(ring); g.position.set(x,0,z); scene.add(g); return g;
}
const crystalObjs=[makeCrystal(-12,-12),makeCrystal(14,-18),makeCrystal(-18,15),makeCrystal(18,12)];
const coins=[];
for(let i=0;i<16;i++){
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.08,16),new THREE.MeshStandardMaterial({color:0xffd447,metalness:.6,roughness:.25}));
  c.rotation.z=Math.PI/2; c.position.set((Math.random()-.5)*55,.35,(Math.random()-.5)*55); c.castShadow=true; scene.add(c); coins.push(c);
}
// inimigos
const enemies=[];
function enemy(x,z){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.SphereGeometry(.65,14,12),mat(0x573a69)); b.position.y=.75; b.castShadow=true; g.add(b);
  const e1=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xff4b55})); e1.position.set(-.2,.9,-.55); g.add(e1);
  const e2=e1.clone(); e2.position.x=.2; g.add(e2);
  g.position.set(x,0,z); scene.add(g); enemies.push({g,hp:2,hit:0});
}
enemy(-7,-18); enemy(9,-8); enemy(-15,5); enemy(11,18); enemy(-22,-1);

const portal=new THREE.Group();
const pRing=new THREE.Mesh(new THREE.TorusGeometry(1.6,.15,12,32),new THREE.MeshStandardMaterial({color:0x36a9ff,emissive:0x1255ff,emissiveIntensity:2}));
portal.add(pRing); pRing.position.y=1.7; pRing.rotation.y=Math.PI/2;
const pCore=new THREE.Mesh(new THREE.CylinderGeometry(1.25,1.25,.15,32),new THREE.MeshBasicMaterial({color:0x1a77ff,transparent:true,opacity:.35}));
pCore.rotation.x=Math.PI/2; pCore.position.y=1.7; portal.add(pCore); portal.position.set(0,0,-43); scene.add(portal);
// ÁGUA E CACHOEIRA
const waterMat=new THREE.MeshStandardMaterial({color:0x2b9ee8,transparent:true,opacity:.62,roughness:.15,metalness:.05});
const lake=new THREE.Mesh(new THREE.CircleGeometry(10,48),waterMat);
lake.rotation.x=-Math.PI/2; lake.position.set(-25,.04,-22); scene.add(lake);
const waterfall=new THREE.Mesh(new THREE.PlaneGeometry(7,10,1,12),new THREE.MeshStandardMaterial({color:0x8edcff,transparent:true,opacity:.7,side:THREE.DoubleSide}));
waterfall.position.set(27,5,-24); waterfall.rotation.y=Math.PI/2; scene.add(waterfall);
for(let i=0;i<18;i++){
  const drop=new THREE.Mesh(new THREE.SphereGeometry(.05+Math.random()*.05,6,6),new THREE.MeshBasicMaterial({color:0xbdeeff,transparent:true,opacity:.8}));
  drop.position.set(23+Math.random()*7,Math.random()*9,-24+Math.random()*1.5); scene.add(drop);
  drop.userData.speed=2+Math.random()*3; drop.userData.baseY=drop.position.y;
}

// CASAS
function house(x,z){
  const g=new THREE.Group();
  const walls=new THREE.Mesh(new THREE.BoxGeometry(5,3.2,4),mat(0x9b7049)); walls.position.y=1.6; walls.castShadow=true; g.add(walls);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(3.6,2.4,4),mat(0x513a2d)); roof.rotation.y=Math.PI/4; roof.position.y=4.4; roof.castShadow=true; g.add(roof);
  const door=new THREE.Mesh(new THREE.BoxGeometry(.9,1.7,.12),mat(0x33241c)); door.position.set(0,.85,2.06); g.add(door);
  g.position.set(x,0,z); scene.add(g);
}
house(-8,-30); house(10,-31); house(28,4);

// NPCs
const npcs=[];
function npc(x,z,name){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.8,4,8),mat(0x7d4938)); b.position.y=1.2; g.add(b);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),mat(0xd09265)); h.position.y=2.05; g.add(h);
  g.position.set(x,0,z); scene.add(g); npcs.push({g,name});
}
npc(-8,-26,"Ayla"); npc(10,-27,"Téo"); npc(28,7,"Mira");

// PARTICULAS
const particles=[];
function burst(pos,color=0x75c8ff,count=14){
  for(let i=0;i<count;i++){
    const p=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));
    p.position.copy(pos); scene.add(p);
    p.userData.v=new THREE.Vector3((Math.random()-.5)*3,Math.random()*3+.5,(Math.random()-.5)*3);
    p.userData.life=.5+Math.random()*.5; particles.push(p);
  }
}

// ZONA DO DESERTO (visível além do portal: primeira transição de mundo)
const desertGate=new THREE.Group();
const dg=new THREE.Mesh(new THREE.TorusGeometry(2.2,.18,12,32),new THREE.MeshStandardMaterial({color:0xffb13b,emissive:0x8a3f00,emissiveIntensity:1.7}));
dg.rotation.y=Math.PI/2; dg.position.y=2.2; desertGate.add(dg);
const ds=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,.12,32),new THREE.MeshBasicMaterial({color:0xff8a20,transparent:true,opacity:.25}));
ds.rotation.x=Math.PI/2; ds.position.y=2.2; desertGate.add(ds);
desertGate.position.set(42,0,-35); scene.add(desertGate);


const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){attack();jump()}});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let hp=100, crystalsFound=0, coinCount=0, attacking=0, invul=0;
const hpEl=document.getElementById('hp'), crystalEl=document.getElementById('crystals'), coinEl=document.getElementById('coins'), msg=document.getElementById('msg');
function say(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>msg.style.opacity=0,1800)}
function damage(n){if(invul>0)return; hp=Math.max(0,hp-n);invul=1;hpEl.style.width=hp+'%';say('Você levou dano!'); if(hp<=0){hp=100;player.position.set(0,0,8);hpEl.style.width='100%';say('Você caiu e voltou ao último ponto.');}}
function attack(){
 if(attacking>0)return; attacking=.28;
 sword.rotation.x=-1.1;
 for(const e of enemies){
   const d=player.position.distanceTo(e.g.position);
   if(d<2.8){e.hp--; e.hit=.2; e.g.position.add(new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y)).multiplyScalar(-1.0)); if(e.hp<=0){e.g.visible=false;e.dead=true;say('Inimigo derrotado!');}}
 }
}
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});


let vy=0, onGround=true;
function jump(){
  if(onGround){vy=8.5;onGround=false;say('Salto!');}
}
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});

// joystick
let joy={x:0,y:0,active:false}; const stick=document.getElementById('stick'),knob=document.getElementById('knob');
function joyMove(e){const r=stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy),max=42;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}
stick.addEventListener('pointerdown',e=>{joy.active=true;stick.setPointerCapture(e.pointerId);joyMove(e)});
stick.addEventListener('pointermove',e=>{if(joy.active)joyMove(e)});
stick.addEventListener('pointerup',()=>{joy.active=false;joy.x=joy.y=0;knob.style.transform='translate(0,0)'});

const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop); const dt=Math.min(clock.getDelta(),.04);
 if(invul>0)invul-=dt; if(attacking>0){attacking-=dt;if(attacking<=0)sword.rotation.x=0}
 crystalObjs.forEach((g,i)=>{g.rotation.y+=dt*1.3;g.position.y=Math.sin(performance.now()/500+i)*.08});
 coins.forEach(c=>{c.rotation.y+=dt*4});
 let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
 let iz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;
 const v=new THREE.Vector2(ix,iz); if(v.length()>1)v.normalize();
 if(v.length()>.05){
   const speed=7*dt; player.position.x+=v.x*speed; player.position.z+=v.y*speed;
   player.rotation.y=Math.atan2(v.x,v.y);
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-72,72);player.position.z=THREE.MathUtils.clamp(player.position.z,-72,72);
 crystalObjs.forEach((g,i)=>{if(g.visible&&player.position.distanceTo(g.position)<2){g.visible=false;crystalsFound++;crystalEl.textContent=crystalsFound;burst(g.position.clone().add(new THREE.Vector3(0,1,0)),0x55aaff,22);say('💎 Cristal encontrado!')}});
 coins.forEach(c=>{if(c.visible&&player.position.distanceTo(c.position)<1.2){c.visible=false;coinCount++;coinEl.textContent=coinCount}});
 enemies.forEach(e=>{
   if(e.dead)return; e.hit=Math.max(0,e.hit-dt);
   const d=e.g.position.distanceTo(player.position);
   if(d<10){const dir=player.position.clone().sub(e.g.position).setY(0).normalize();e.g.position.addScaledVector(dir,dt*1.6)}
   if(d<1.45)damage(12);
 });
 portal.rotation.y+=dt;
 npcs.forEach(n=>{if(player.position.distanceTo(n.g.position)<2.4 && Math.random()<.015)say(n.name+': Continue, aventureiro! Os cristais estão esperando.');});
 if(crystalsFound===4&&player.position.distanceTo(portal.position)<3){document.getElementById('win').style.display='flex'}
 // camera follow
 const target=new THREE.Vector3(player.position.x,5.8,player.position.z+9);
 camera.position.lerp(target,.09);
 camera.lookAt(player.position.x,1.2,player.position.z);
 
 // física do pulo
 vy-=20*dt; player.position.y+=vy*dt;
 if(player.position.y<=0){player.position.y=0;vy=0;onGround=true}
 // animação simples do personagem
 const moving=v.length()>.05;
 const bob=moving ? Math.sin(performance.now()/90)*.035 : Math.sin(performance.now()/350)*.012;
 body.position.y=1.35+bob; cape.rotation.x=moving ? Math.sin(performance.now()/100)*.08 : 0;
 // efeitos dos cristais, ataques e coleta
 if(attacking>0 && Math.random()<.35) burst(player.position.clone().add(new THREE.Vector3(0,1.2,0)),0x6ab7ff,2);
 // água e gotas
 scene.traverse(o=>{if(o.userData&&o.userData.speed){o.position.y-=o.userData.speed*dt;if(o.position.y<0.1)o.position.y=9+Math.random()*2}});
 // partículas
 for(let i=particles.length-1;i>=0;i--){
   const p=particles[i]; p.userData.life-=dt; p.position.addScaledVector(p.userData.v,dt); p.userData.v.y-=5*dt;
   p.material.opacity=Math.max(0,p.userData.life);
   if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}
 }
 // NPCs olham para o jogador
 npcs.forEach(n=>n.g.lookAt(player.position.x,n.g.position.y,player.position.z));
 desertGate.rotation.y+=dt*.6;
 renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
